apis:
- name: Arbor Sightline SP REST API
  description: >-
    JSON:API-compliant REST API for NETSCOUT Arbor Sightline (formerly SP/Peakflow),
    fully discoverable from the root URL /api/sp/. Exposes network traffic data, DDoS
    alerts, managed objects, mitigations and reporting on the Sightline appliance.
    API v5 ships with Sightline 9.0; the public cookbook documents SP v8.4 / API v4.
  humanURL: https://arbor.github.io/sp-rest-api-cookbook/
  baseURL: https://arbor.github.io/sp-rest-api-cookbook/sp-rest-api-tutorial.html
