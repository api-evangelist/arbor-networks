    url: https://github.com/arbor/sp-rest-api-cookbook
- name: Arbor Edge Defense Manager (EDM) API
  description: >-
    REST API for NETSCOUT Arbor Edge Defense Manager (EDM) covering device management,
    alert and threat viewing (DDoS alerts, threats), traffic analysis, Contextual Threat
    Intelligence (CTI) data/config and executive report generation. Authenticated with
    an API token generated from the EDM command line.
