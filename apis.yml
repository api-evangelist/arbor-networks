name: Arbor Networks
description: >-
  Arbor Networks is the DDoS protection and network-visibility division of NETSCOUT
  (Arbor Networks was acquired by NETSCOUT in 2015). Drawing on more than 25 years of
  experience and visibility into roughly 800 Tbps of global internet traffic across
  550+ service-provider and enterprise customers, Arbor builds products that detect and
  mitigate distributed denial-of-service (DDoS) attacks and provide network traffic
  analytics. Its portfolio includes Arbor Sightline (formerly Peakflow SP) for
  service-provider-scale monitoring, analytics and mitigation orchestration; Arbor Edge
  Defense (AED) as an inline stateless perimeter appliance; the Arbor Threat Mitigation
  System (TMS); Arbor Cloud managed scrubbing (16 global scrubbing centers, 15+ Tbps);
  and Arbor Spectrum/Insight for advanced threat analytics. Arbor exposes programmatic
  control primarily through the Sightline "SP REST API" (a JSON:API-compliant interface
  rooted at /api/sp/ on the appliance) and the Edge Defense Manager (EDM) API, with
  first-party client tooling published on GitHub and PyPI.
